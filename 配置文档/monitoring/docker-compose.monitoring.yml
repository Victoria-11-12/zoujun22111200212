# ========================================
# 可观测性监控组件 - Docker Compose 配置
# Prometheus + Grafana + nginx-exporter
# 独立于主项目部署，需与主项目共享 Docker 网络
# ========================================

version: '3.8'

services:
  # -------------------- Prometheus 监控 --------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: movie_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - movie_network

  # -------------------- Grafana 可视化 --------------------
  grafana:
    image: grafana/grafana:latest
    container_name: movie_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - movie_network
    depends_on:
      - prometheus

  # -------------------- Nginx Exporter --------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: movie_nginx_exporter
    restart: unless-stopped
    ports:
      - "${EXPORTER_PORT:-9113}:9113"
    command:
      - '--nginx.scrape-uri=http://${NGINX_HOST:-nginx}:80/nginx_status'
    networks:
      - movie_network
    depends_on:
      - prometheus

# -------------------- 数据卷 --------------------
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# -------------------- 网络配置 --------------------
# 加入主项目的 Docker 网络，使 nginx-exporter 能访问 nginx 容器
networks:
  movie_network:
    external: true
