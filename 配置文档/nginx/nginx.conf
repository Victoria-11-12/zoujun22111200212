# ========================================
# Nginx 反向代理配置
# 统一入口：80 端口（HTTP）
# ========================================

server {
    listen 80;
    server_name _;

    # ========================================
    # Node.js 业务服务
    # 前端页面、静态资源、登录注册、用户管理
    # ========================================
    location / {
        proxy_pass http://web_node:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # Flask 算法服务
    # 票房预测、黑马挖掘、ROI分析
    # 注意：Flask 接口自带 /api/flask 前缀
    # ========================================
    location /api/flask/ {
        proxy_pass http://flask:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========================================
    # FastAPI Agent 服务
    # AI 对话、图表生成、质量评估、管理员AI
    # ========================================
    location /api/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
